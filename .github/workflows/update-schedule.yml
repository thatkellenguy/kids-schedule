name: Update games schedule

# Adds a "Run workflow" button on the repo's Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar tools
        run: pip install icalendar recurring-ical-events

      - name: Pull games from Google Calendar
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python scripts/update_schedule.py

      - name: Save changes
        run: |
          if git diff --quiet -- index.html; then
            echo "Schedule already up to date — nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update games schedule from calendar"
          git push
